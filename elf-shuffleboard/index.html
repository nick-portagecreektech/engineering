<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="rooms-endpoint" content="https://elf-overboard-rooms.rb292k5bq8.workers.dev"><meta name="theme-color" content="#12333b"><title>Elf Overboard</title><style>@layer elf-overboard {
:root{color-scheme:dark;--navy:#152d3f;--ink:#201f2d;--cream:#fff0cd;--muted:#a8c9c2;--gold:#dfb879;--sea:#214f55;--red:#b93b4a;--blue:#267c92;--border:#be986968;font:15px/1.37 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{min-height:100svh;margin:0;color:var(--cream);background:radial-gradient(ellipse at 15% 0,#35596a80,transparent 49%),radial-gradient(ellipse at 85% 68%,#3b5e5355,transparent 60%),repeating-linear-gradient(128deg,#fbe5af09 0 1px,transparent 1px 9px),#0e2330}
#game{position:relative;width:min(100%,600px);margin:auto;padding:12px 14px max(10px,env(safe-area-inset-bottom));display:grid;gap:8px;align-items:start}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;padding:1px 2px 2px}
.topline a{color:#b8d4ce;text-decoration:none;font-weight:750;font-size:.72rem}
h1,h2{font-family:Georgia,Cambria,serif;line-height:.94;color:#fff0cc;letter-spacing:-.044em;margin:0}
h1{font-size:clamp(32px,8vw,48px);text-shadow:0 2px #6b3039}
h2{font-size:clamp(30px,8vw,42px)}
.topline small,.kicker,.eyebrow{display:block;color:#ffe0a7;text-transform:uppercase;letter-spacing:.18em;font-size:.67rem;font-weight:800;margin:4px 0}
button,input{font:inherit;min-height:44px;border-radius:10px}
button{touch-action:manipulation;background:#2a515a;color:var(--cream);border:1px solid var(--border);font-weight:800;cursor:pointer;padding:8px 12px}
button:hover{background:#3b6570}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,#board:focus-visible{outline:3px solid #f5cd85;outline-offset:2px}
button:disabled{cursor:default;opacity:.62}
#mute{min-width:47px;min-height:43px;padding:6px 8px;background:#243c48;color:#ffe1ad}
.scoreboard{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:center;background:#0f2632e8;border:1px solid var(--border);border-radius:12px;padding:5px;box-shadow:0 2px 0 #0f2029}
.team{display:flex;align-items:center;justify-content:space-between;gap:4px;min-height:38px;padding:4px 8px;border:1px solid #ffffff30;border-radius:8px;font-size:.75rem;font-weight:800}
.team.red{background:linear-gradient(145deg,#9e394c,#682f40)}
.team.blue{background:linear-gradient(145deg,#2c7185,#225669)}
.team strong,#redScore,#blueScore{font:800 23px/1 Georgia,serif;color:#fff2d4}
#turnLabel{white-space:normal;min-width:0;max-width:12ch;padding:0 2px;text-align:center;font-size:.72rem;font-weight:850;line-height:1.13;color:var(--cream)}
#boardWrap{overflow:hidden;position:relative;width:min(100%,calc((100svh - 154px)*.667));min-width:min(100%,286px);margin:auto;border:1px solid #c6a273b5;border-radius:15px;background:#214f55;box-shadow:0 3px 0 #5a4843,0 11px 23px #06172393;isolation:isolate}
canvas#board{display:block;width:100%;height:auto;aspect-ratio:2/3;touch-action:none;user-select:none;-webkit-user-select:none}
#status{margin:0;color:#fff0cd;min-height:1.5em;font-weight:760;font-size:.83rem;text-align:center;text-wrap:balance}
#shots{min-height:1em;color:#b6d2c8;font-size:.72rem;text-align:center}
#power{width:100%;height:8px;min-height:0;display:block;accent-color:#dfad72}
.controls,.room-tools{display:flex;justify-content:center;flex-wrap:wrap;align-items:center;gap:7px}
.controls button{flex:0 1 115px}
#shoot,#createQuick,#join{color:#fff2d3;background:linear-gradient(#b94856,#91374a);border-color:#eab98097}
#shoot:hover,#createQuick:hover,#join:hover{background:#bf4c59}
#roomCode{font:800 .85rem ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.12em;padding:6px 9px;border:1px solid var(--border);border-radius:9px;color:var(--gold)}
.lobby{position:absolute;inset:0;z-index:3;align-content:center;justify-items:center;display:grid;padding:12px;background:radial-gradient(ellipse at 50% 55%,#102c40df,#0d2131eb 64%,#102a3aba)}
#lobby[hidden],[hidden]{display:none!important}
.lobby .card,.lobby > section,.lobby > article,.lobby > div:has(#createQuick){width:min(100%,335px);max-height:100%;overflow:auto;padding:18px 14px;background:linear-gradient(150deg,#244954,#18353b 65%,#2e3544);border:1px solid #dcb77ca1;border-radius:15px;box-shadow:0 12px 36px #081829ab}
.lobby p{color:#d2e5d7;font-size:.82rem;margin:7px 0 10px;text-wrap:balance}
.lobby button{min-width:0}
#joinForm{display:flex;align-items:center;gap:5px;margin:8px 0 0}
#joinCode{min-width:0;width:100%;background:#142e3a;border:1px solid #d7b57c70;color:#fff0cd;padding:7px 8px;text-transform:uppercase;letter-spacing:.10em}
#lobbyError:empty{display:none}
#lobbyError{color:#ffd3ad;font-size:.82rem;margin:6px 0 0}
footer{color:#98b9b5;font-size:.68rem;text-align:center}
@media(max-width:430px){#game{padding:7px 8px max(6px,env(safe-area-inset-bottom));gap:6px}.team{min-height:36px;font-size:.7rem}.team strong,#redScore,#blueScore{font-size:21px}#boardWrap{border-radius:11px}.lobby .card,.lobby > section,.lobby > article,.lobby > div:has(#createQuick){padding:14px 11px}button{padding:6px 8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
}

@layer elf-overboard {
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;padding:0;border:0}
#joinCode{flex:1}
.room-tools:has(#roomCode:empty){display:none}
.mode-row{display:flex;gap:6px}
.mode-row button{flex:1;white-space:nowrap}
.mode-row small{font-size:.65em}
#practice{width:100%;margin-top:8px}
@media(max-width:430px) and (max-height:740px){
 #game{gap:5px}
 #game:has(#lobby[hidden]) #boardWrap{width:min(100%,calc((100svh - 226px)*.667));min-width:min(100%,235px)}
 .controls button{flex-basis:100px}
}
}
</style></head>
