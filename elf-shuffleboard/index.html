<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="rooms-endpoint" content="https://elf-overboard-rooms.rb292k5bq8.workers.dev"><meta name="theme-color" content="#12333b"><title>Elf Overboard</title><style>@layer elf-overboard {
:root{color-scheme:dark;--navy:#152d3f;--cream:#fff0cd;--muted:#a8c9c2;--gold:#dfb879;--border:#be986968;font:15px/1.37 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{color:var(--cream);background:radial-gradient(ellipse at 55% -20%,#57404b96,transparent 55%),radial-gradient(ellipse at 85% 68%,#36645860,transparent 60%),repeating-linear-gradient(128deg,#fbe5af08 0 1px,transparent 1px 9px),#101e2b}
#game{
 width:min(100%,625px);height:100vh;height:100svh;height:min(100dvh,var(--game-visible-height,100dvh));margin:auto;
 padding:max(7px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
 display:grid;grid-template-rows:52px minmax(0,1fr) 91px;gap:6px;
}
button,input{font:inherit;min-height:44px;border-radius:10px}
button{touch-action:manipulation;background:#2a515a;color:var(--cream);border:1px solid var(--border);font-weight:800;cursor:pointer;padding:6px 9px}
button:hover{background:#3b6570}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,#board:focus-visible{outline:3px solid #f5cd85;outline-offset:2px}
button:disabled{cursor:default;opacity:.62}
#mute{width:44px;height:44px;padding:0;background:#243c48;color:#ffe1ad}
.scoreboard{min-width:0;height:52px;display:grid;grid-template-columns:minmax(0,1fr) minmax(min-content,auto) minmax(0,1fr) 44px;gap:5px;align-items:center;background:#0f2632e8;border:1px solid #dfb87b85;border-radius:12px;padding:3px;box-shadow:0 2px 0 #0f2029,inset 0 1px #fff2bc1c}
.team{display:flex;align-items:center;justify-content:space-between;gap:4px;min-width:0;height:38px;padding:4px 7px;border:1px solid #ffffff30;border-radius:8px;font-size:.72rem;font-weight:800}
.team.red{background:linear-gradient(145deg,#9e394c,#682f40)}
.team.blue{background:linear-gradient(145deg,#2c7185,#225669)}
.team strong{font:800 clamp(18px,5vw,23px)/1 Georgia,serif;color:#fff2d4;font-variant-numeric:tabular-nums}
#turnLabel{width:9.4ch;padding:0 1px;text-align:center;font-size:.7rem;font-weight:850;line-height:1.13;color:var(--cream)}
.deck-slot{display:grid;place-items:center;position:relative;container-type:size;min-width:0;min-height:0}
#boardWrap{position:relative;width:auto;height:100%;max-width:100%;max-height:100%;aspect-ratio:2/3;border:1px solid #ebc584a6;border-radius:12px;background:#214f55;box-shadow:0 3px 0 #704b3f,0 8px 23px #06172393;isolation:isolate}
@supports(width:1cqw){#boardWrap{width:min(100cqw,calc(100cqh * 2 / 3));height:auto}}
canvas#board{display:block;width:100%;height:100%;aspect-ratio:2/3;border-radius:inherit;touch-action:none;user-select:none;-webkit-user-select:none}
.turn-panel{height:91px;min-width:0;display:grid;grid-template-rows:16px 27px 44px;gap:2px;align-items:center;text-align:center}
.shot-info{display:flex;justify-content:center;align-items:center;gap:8px;min-width:0;height:16px}
#shots{color:#b6d2c8;font-size:.72rem;white-space:nowrap}
#roomCode{font:750 .66rem/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.035em;color:var(--gold);white-space:nowrap}
#status{margin:0;color:#fff0cd;font-weight:760;font-size:.8rem;line-height:1.11;text-align:center;text-wrap:balance}
.controls{display:flex;justify-content:center;align-items:center;gap:6px;min-width:0;height:44px}
.controls button{flex:0 1 114px;min-width:0;height:44px;font-size:.83rem;line-height:1.08;padding:4px 6px;text-wrap:balance}
#shoot,#createQuick,#join{color:#fff2d3;background:linear-gradient(#b94856,#91374a);border-color:#eab98097}
#shoot:hover,#createQuick:hover,#join:hover{background:#bf4c59}
.lobby{position:absolute;inset:0;z-index:3;align-content:center;justify-items:center;display:grid;padding:7px;border-radius:inherit;background:radial-gradient(ellipse at 50% 55%,#102c40df,#0d2131eb 64%,#102a3aba)}
#lobby[hidden],[hidden]{display:none!important}
.lobby-card{width:min(100%,335px);max-height:100%;overflow:auto;min-width:0;padding:13px 10px;background:linear-gradient(150deg,#224b46,#193238 65%,#483141);border:1px solid #e8ba7cb1;border-radius:13px;box-shadow:0 12px 36px #081829ab}
h2{font:800 clamp(23px,7vw,39px)/.96 Georgia,Cambria,serif;color:#fff0cc;letter-spacing:-.044em;margin:0}
.lobby p{color:#d2e5d7;font-size:.8rem;margin:6px 0 8px;text-wrap:balance}
.lobby .eyebrow{color:#ffe0a7;text-transform:uppercase;letter-spacing:.12em;font-size:.58rem;font-weight:800;margin:0 0 6px}
.lobby button{min-width:0;font-size:.81rem}
#joinForm{display:flex;align-items:center;gap:5px;margin:6px 0 0}
#joinCode{flex:1;min-width:0;width:100%;background:#142e3a;border:1px solid #d7b57c70;color:#fff0cd;padding:6px 7px;text-transform:uppercase;letter-spacing:.05em;font-size:16px}
#lobbyError:empty{display:none}
#lobbyError{color:#ffd3ad;font-size:.76rem;margin:6px 0 0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;padding:0;border:0}
.mode-row{display:flex;gap:5px}
.mode-row button{flex:1;white-space:nowrap}
.mode-row small{font-size:.72em;display:block}
#practice{width:100%;margin-top:6px}
@container(max-height:285px){
 .lobby-card{padding:7px}
 .lobby .eyebrow{display:none}
 .lobby h2{font-size:21px}
 .lobby p{font-size:.72rem;margin:4px 0 5px}
 .lobby-card:has(#joinCode:focus) :is(h2,p:not(#lobbyError),.mode-row,#practice){display:none}
}
/* A phone keyboard can make a portrait viewport wider than tall. */
@media (orientation:landscape) and (min-width:550px) and (max-height:510px){
 #game{width:min(100%,920px);grid-template-columns:minmax(0,1fr) minmax(235px,1fr);grid-template-rows:52px minmax(0,1fr);column-gap:10px}
 .deck-slot{grid-column:1;grid-row:1/3}
 .scoreboard{grid-column:2;grid-row:1}
 .turn-panel{grid-column:2;grid-row:2;align-self:start}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
}

/* Compact room creation and guest entry, within the same fixed deck grid. */
@layer elf-overboard {
.lobby-card h2{font-size:clamp(23px,6.1vw,33px)}
#joinForm{display:grid;gap:4px;margin:8px 0 0;padding:7px;border:1px solid #d3b37b75;border-radius:10px;background:#0b243b66}
#joinForm label{display:flex;justify-content:space-between;align-items:baseline;gap:4px;color:var(--cream);font-weight:800;font-size:.76rem}
#joinForm label small{color:var(--muted);font-size:.65rem;font-weight:600;white-space:nowrap}
.join-fields{display:flex;min-width:0;gap:5px}
.join-fields #join{flex:0 0 auto;padding-inline:8px}
.invite-card{text-align:center}
#inviteCode{margin:5px 0;display:block;font:800 clamp(15px,5.6vw,30px)/1.15 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.07em;color:var(--gold);white-space:nowrap;user-select:all}
#waitShare,#manualCopy{background:linear-gradient(#b94856,#91374a);border-color:#eab98097}
#inviteDialog{width:min(340px,calc(100vw - 24px));max-height:calc(100dvh - 20px);padding:14px 12px;border:1px solid #e8ba7cb1;border-radius:13px;background:#193238;color:var(--cream)}
#inviteDialog::backdrop{background:#0a1729c9}
#inviteDialog h2{font-size:25px}
#inviteDialog p{margin:6px 0 9px;font-size:.8rem}
#inviteURL{width:100%;background:#142e3a;border:1px solid #d7b57c70;color:#fff0cd;padding:6px;font-size:16px;margin-bottom:7px}
@container(max-height:285px){
 #joinForm{padding:5px;margin-top:5px}
 .lobby-card h2{font-size:19px}
 .lobby-card:has(#joinCode:focus) :is(h2,p:not(#lobbyError),.mode-row,#practice){display:none}
}
}

/* The lobby is a menu, not part of the 2:3 playing surface. It can use
   the entire available width even on a very short browser viewport. */
@layer elf-overboard {
#lobby{padding:0;background:none}
.deck-slot:has(#lobby:not([hidden])) #boardWrap{visibility:hidden}
#lobby .lobby-card{width:min(100%,444px);padding:16px;max-height:100%}
#lobby h2{font-size:clamp(28px,7vw,36px)}
#lobby p{font-size:.88rem;text-wrap:pretty}
#lobby button{min-height:48px;font-size:.9rem}
#lobby #joinForm{padding:9px;margin-top:9px;gap:6px}
#lobby #joinForm label{font-size:.85rem}
#lobby .join-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(64px,auto);gap:7px}
#lobby #joinCode{min-height:48px;font-size:18px;letter-spacing:.05em}
#lobby .join-fields #join{padding-inline:12px}
@container(max-height:320px){
 #lobby .lobby-card{padding:9px 11px}
 #lobby h2{font-size:25px}
 #lobby p{margin:4px 0 6px;font-size:.79rem}
 #lobby #joinForm{padding:6px;margin-top:6px;gap:4px}
}
@container(max-height:285px){
 #lobby .lobby-card:has(#joinCode:focus) :is(h2,p:not(#lobbyError),.mode-row,#practice){display:none}
 #lobby .lobby-card:has(#joinCode:focus) #joinForm{margin:0}
}
}

/* Fresh liner artwork and a compact, shot-counting maritime dashboard. */
@layer elf-overboard {
#game{--dashboard-h:66px;grid-template-rows:var(--dashboard-h) minmax(0,1fr) 91px}
.scoreboard{position:relative;height:var(--dashboard-h);grid-template-columns:minmax(0,1fr) 58px minmax(0,1fr) 44px;gap:5px;padding:18px 4px 2px;background:#102535;border-radius:13px}
.ship-profile{position:absolute;inset:0 0 auto;width:100%;height:44px;pointer-events:none;opacity:.95}
.team{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:1fr 7px;gap:2px 3px;height:42px;padding:3px 6px 2px;background:#102e3b;border-color:#d1af8b70}
.team span:not(.shot-lamps){overflow:hidden;text-overflow:ellipsis}
.team strong{grid-column:2;grid-row:1}
.team.red{background:linear-gradient(#72293b,#4b2432)}
.team.blue{background:linear-gradient(#23516b,#17364a)}
.shot-lamps{grid-column:1/3;display:flex;gap:4px;align-items:center}
.shot-lamps i{width:5px;height:5px;border-radius:100%;box-shadow:0 0 3px #ffc479;background:#ffbb68}
.team.blue .shot-lamps i{background:#83ddea;box-shadow:0 0 3px #83ddea}
.shot-lamps .spent,.team.blue .shot-lamps .spent{background:#40525a;box-shadow:none;opacity:.65}
.condition-cluster{position:relative;z-index:1;display:grid;grid-template-rows:14px 22px;justify-items:center;align-content:center;min-width:0;align-self:center;padding:2px 3px;border:1px solid #c8a785a0;border-radius:7px;background:#172f39}
#turnLabel{width:auto;white-space:nowrap;padding:0;font-size:.65rem}
.sea-dial{width:45px;height:23px;border-radius:12px;background:#183d3d;border:1px solid #6eb4a963}
.sea-dial svg{width:100%;height:100%;display:block}
#mute{position:relative;z-index:1}
@media(orientation:landscape) and (min-width:550px) and (max-height:510px){
 #game{grid-template-rows:var(--dashboard-h) minmax(0,1fr)}
}
}
.top-tools{display:flex;align-items:center}
